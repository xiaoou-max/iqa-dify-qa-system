# ============================================================
# Dify Community Edition - Docker Compose (官方标准结构)
# 入口: nginx :8081 -> web/api
# 依赖: db(postgres) / redis / weaviate / sandbox
# ============================================================
x-shared: &shared
  image: langgenius/dify-api:1.16.1
  restart: always
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    weaviate:
      condition: service_healthy
  environment: &shared-env
    MODE: api
    SECRET_KEY: ${SECRET_KEY}
    # ---- DB ----
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_DATABASE: ${DB_DATABASE}
    # ---- Redis ----
    REDIS_HOST: ${REDIS_HOST}
    REDIS_PORT: ${REDIS_PORT}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
    # ---- Weaviate ----
    VECTOR_STORE: ${VECTOR_STORE:-weaviate}
    WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT}
    WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    WEAVIATE_GRPC_ENABLED: ${WEAVIATE_GRPC_ENABLED:-false}
    # ---- Storage ----
    STORAGE_TYPE: ${STORAGE_TYPE:-local}
    OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-/opt/dify/storage}
    # ---- Web URL ----
    CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
    CONSOLE_API_URL: ${CONSOLE_API_URL}
    SERVICE_API_URL: ${SERVICE_API_URL}
    APP_WEB_URL: ${APP_WEB_URL}
    APP_API_URL: ${APP_API_URL}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-*}
    # ---- Mail ----
    MAIL_TYPE: ${MAIL_TYPE:-}
    MAIL_DEFAULT_SEND_FROM: ${MAIL_DEFAULT_SEND_FROM:-}
    SMTP_SERVER: ${SMTP_SERVER:-}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    # ---- Sandbox ----
    CODE_MAX_NUMBER: ${CODE_MAX_NUMBER:-9223372036854775807}
    CODE_EXECUTION_TIME: ${CODE_EXECUTION_TIME:-30}
    SANDBOX_PORT: ${SANDBOX_PORT:-8194}
    SANDBOX_WORK_DIR: ${SANDBOX_WORK_DIR:-/app/sandbox}
    WORKSPACE_DOMAIN: ${WORKSPACE_DOMAIN:-sandbox}
    WORKSPACE_API_KEY: ${WORKSPACE_API_KEY}
    # ---- Misc ----
    DEPLOY_ENV: ${DEPLOY_ENV:-PRODUCTION}
    DIFY_BIND_ADDRESS: 0.0.0.0
    DIFY_PORT: 5001
    SERVER_WORKER_AMOUNT: ${SERVER_WORKER_AMOUNT:-1}
    CELERY_WORKER_CLASS: ${CELERY_WORKER_CLASS:-gthread}
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    TOOL_WORKER_CONCURRENCY: ${TOOL_WORKER_CONCURRENCY:-4}
    INIT_PASSWORD: ${INIT_PASSWORD}
    INIT_EMAIL: ${INIT_EMAIL}
    DISABLE_LOCAL: ${DISABLE_LOCAL:-false}
    # ---- Plugin Daemon ----
    PLUGIN_DAEMON_URL: http://plugin-daemon:5002
    PLUGIN_DAEMON_KEY: plugin-api-key
  env_file:
    - .env

services:
  # ============================================================
  # 基础中间件
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: dify-db
    restart: always
    environment:
      PGUSER: ${DB_USERNAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    networks:
      - dify

  redis:
    image: redis:6-alpine
    container_name: dify-redis
    restart: always
    command: >
      sh -c "redis-server --appendonly yes --requirepass '${REDIS_PASSWORD}'"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ./volumes/redis/data:/data
    networks:
      - dify

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: dify-weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: dify@local
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    networks:
      - dify

  sandbox:
    image: langgenius/dify-sandbox:0.2.1
    container_name: dify-sandbox
    restart: always
    environment:
      SANDBOX_WORKER_PORT: ${SANDBOX_PORT:-8194}
      WORKSPACE_API_KEY: ${WORKSPACE_API_KEY}
      GIN_MODE: "release"
    volumes:
      - ./volumes/sandbox:/tmp
    networks:
      - dify
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================
  # Dify 后端
  # ============================================================
  api:
    <<: *shared
    container_name: dify-api
    command: [ "/bin/bash", "-c", "flask db upgrade && ./entrypoint.sh" ]
    environment:
      <<: *shared-env
      MODE: api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 120s
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/storage:${OPENDAL_FS_ROOT:-/opt/dify/storage}
    networks:
      - dify

  worker:
    <<: *shared
    container_name: dify-worker
    command: [ "celery", "-A", "tasks", "worker", "-P", "${CELERY_WORKER_CLASS:-gthread}", "-c", "${CELERY_WORKER_CONCURRENCY:-4}", "-l", "INFO" ]
    environment:
      <<: *shared-env
      MODE: worker
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/storage:${OPENDAL_FS_ROOT:-/opt/dify/storage}
    networks:
      - dify

  beat:
    <<: *shared
    container_name: dify-beat
    command: [ "celery", "-A", "tasks", "beat", "-l", "INFO", "--scheduler", "celery.beat.PersistentScheduler", "-f", "/tmp/celerybeat-schedule" ]
    environment:
      <<: *shared-env
      MODE: beat
    volumes:
      - ./volumes/app/storage:/app/storage
    networks:
      - dify

  # ============================================================
  # Dify 前端控制台 Web
  # ============================================================
  web:
    image: langgenius/dify-web:1.16.1
    container_name: dify-web
    restart: always
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      SERVER_CONSOLE_API_URL: "http://api:5001"
      APP_API_URL: ${APP_API_URL}
      APP_WEB_URL: ${APP_WEB_URL}
      NEXT_PUBLIC_API_PREFIX: "/console/api"
      NEXT_PUBLIC_PUBLIC_API_PREFIX: "/api"
      HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    command: ["./entrypoint.sh"]
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\" || node -e \"require('http').get('http://0.0.0.0:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dify

  # ============================================================
  # Nginx 统一入口
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: dify-nginx
    restart: always
    ports:
      - "${EXPOSE_NGINX_PORT:-8081}:80"
      - "${EXPOSE_NGINX_SSL_PORT:-8443}:443"
    environment:
      NGINX_SERVER_NAME: "_"
      NGINX_HTTPS_STATUS: "off"
      NGINX_SSL_CERT_FILENAME: ""
      NGINX_SSL_CERT_KEY_FILENAME: ""
      NGINX_PORT: 80
      NGINX_SSL_PORT: 443
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/app/storage:/app/storage
    networks:
      - dify

networks:
  dify:
    driver: bridge
    name: dify
