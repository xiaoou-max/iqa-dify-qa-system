    - data:
        code: "import json\nimport ast\nimport re\n\ndef convert_markdown_json_to_standard(markdown_json_str):\n\
          \    \"\"\"\n    将markdown格式的json字符串转换为标准json字符串\n    如果输入已经是标准json字符串则直接返回\n\
          \    \n    参数：\n    markdown_json_str (str): markdown格式的json字符串\n    \n\
          \    返回：\n    str: 标准json字符串\n    \"\"\"\n    try:\n        # 先尝试直接解析为标准JSON\n\
          \        json.loads(markdown_json_str)\n        return markdown_json_str\
          \  # 已经是标准JSON\n    except json.JSONDecodeError:\n        # 使用正则表达式提取json内容\n\
          \        match = re.match(r'^```json\\n(.*)\\n```$', markdown_json_str,\
          \ re.DOTALL)\n        if match:\n            json_content = match.group(1).strip()\n\
          \            # 使用ast.literal_eval安全解析\n            parsed_data = ast.literal_eval(json_content)\n\
          \            return json.dumps(parsed_data, ensure_ascii=False, indent=4)\n\
          \        else:\n            # 如果正则不匹配，尝试原始分割方法\n            json_content\
          \ = markdown_json_str.split(\"```json\\n\")[1].strip().rstrip(\"```\")\n\
          \            parsed_data = ast.literal_eval(json_content)\n            return\
          \ json.dumps(parsed_data, ensure_ascii=False, indent=4)\n\ndef main(queryObjectStr:\
          \ str) -> dict:\n    queryObjectStr = convert_markdown_json_to_standard(queryObjectStr)\n\
          \    # 解析 queryObjectStr 配置字符串为 JSON 对象\n    queryObject = json.loads(queryObjectStr)\n\
          \    \n    \n    return {\"sqls\": queryObject['sqls'],\"queryContents\"\
          :queryObject['queryContents'],\"write_excel\":queryObject['write_excel'],\"\
          think\":queryObject['think']}"
