    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nCreated on Wed Mar 12 17:21:00 2025\n\
          \n@author: 29613\n\"\"\"\n\ndef escape_special_characters_in_json(json_obj):\n\
          \    if isinstance(json_obj, dict):\n        # 如果json_obj是字典，则递归处理每个键值对\n\
          \        escaped_dict = {}\n        for key, value in json_obj.items():\n\
          \            escaped_dict[key] = escape_special_characters_in_json(value)\n\
          \        return escaped_dict\n    elif isinstance(json_obj, list):\n   \
          \     # 如果json_obj是列表，则递归处理每个元素\n        escaped_list = []\n        for\
          \ item in json_obj:\n            escaped_list.append(escape_special_characters_in_json(item))\n\
          \        return escaped_list\n    elif isinstance(json_obj, str):\n    \
          \    # 如果json_obj是字符串，则检查并转义特殊字符'|'\n        return json_obj.replace('|',\
          \ '-')\n    else:\n        # 如果json_obj不是字典、列表或字符串，则直接返回（不处理）\n        return\
          \ json_obj\n\ndef needs_processing(obj):\n    \"\"\"判断对象是否需要深度处理\"\"\"\n\
          \    for value in obj.values():\n        if isinstance(value, (list, dict)):\n\
          \            return True\n    return False\n\ndef process_item(obj):\n \
          \   \"\"\"处理单个对象中的数组型字段\"\"\"\n    processed = obj.copy()\n    for key in\
          \ list(processed.keys()):  # 使用 list 避免迭代时修改问题\n        value = processed[key]\n\
          \        if isinstance(value, list):\n            # 处理数组字段\n           \
          \ if len(value) > 2:\n                processed[key] = value[:2]\n     \
          \           processed[f\"{key}_description\"] = f\"{key}共{len(value)}条记录，随机展示2条\"\
          \n        elif isinstance(value, dict):\n            # 递归处理嵌套对象\n      \
          \      processed[key] = process_item(value)\n    return processed\n\ndef\
          \ main(input_json_str: str,question: str) -> dict:\n    input_json = json.loads(input_json_str)\n\
          \    showCount = 12\n    excel_url = ''\n    if input_json.get('type') !=\
          \ 'success':\n        return {\"output_json\":input_json,\"excel_url\":excel_url,\"\
          type\":\"fail\",\"sqlResult\":\"none\",\"resultArray\":[{}]}\n    \n   \
          \ if 'excel_url' in input_json:\n        excel_url = input_json['excel_url']\n\
          \    \n    # 定义一个空列表，用来装载每条sql的查询结果，也就是把每个result装载到数组中\n    resultArray\
          \ = []\n    processed_data = {}\n    \n    for key in input_json['data']:\n\
          \        if not key.startswith(\"excel\"):\n            original_array =\
          \ input_json['data'][key]\n            total_records = len(original_array)\n\
          \            if total_records > 20:\n                showCount = 2\n   \
          \         # 首对象类型检测\n            need_deep_process = False\n           \
          \ if original_array and isinstance(original_array[0], dict):\n         \
          \       first_obj = original_array[0]\n                need_deep_process\
          \ = needs_processing(first_obj)\n            \n            # 第一层处理：截取数组前10\n\
          \            truncated_array = original_array[:showCount] if total_records\
          \ > showCount else original_array\n            \n            # 第二层处理：遍历每个对象中的数组字段\n\
          \            # 根据预检结果选择处理方式\n            if need_deep_process:\n       \
          \         processed_array = [process_item(item) for item in truncated_array]\n\
          \            else:\n                processed_array = truncated_array  #\
          \ 直接使用原始对象       \n    \n            processed_data[key] = {\n         \
          \       \"description\": f\"共{total_records}条记录\" + (\"，这里随机展示\"+str(showCount)+\"\
          条\" if total_records > showCount else \"\"),\n                \"data\":\
          \ processed_array,\n                \"question\":question\n            }\n\
          \            \n            resultArray.append({\"data\": processed_array})\
          \  \n            processed_data_new = escape_special_characters_in_json(processed_data)\n\
          \            \n              \n    \n    return {\"output_json\":{\"type\"\
          :\"success\",\"data\":processed_data_new,\"uuid\":input_json['uuid']},\"\
          excel_url\":excel_url,\"sqlResult\":json.dumps(processed_data, ensure_ascii=False),\"\
          resultArray\":resultArray,\"type\":\"success\"}"
