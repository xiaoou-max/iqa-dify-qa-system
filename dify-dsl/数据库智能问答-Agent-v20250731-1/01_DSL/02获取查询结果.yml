    - data:
        code: "def remove_trailing_semicolon(s):\n    \"\"\"去除字符串末尾的分号\"\"\"\n   \
          \ if s.endswith(';'):\n        return s[:-1]\n    return s\n\ndef contains_empty_string(lst):\n\
          \    \"\"\"检查列表是否包含空的子串\"\"\"\n    for item in lst:\n        stripped_item\
          \ = item.strip()\n        if not stripped_item:\n            return True\n\
          \    return False\n\ndef main(sqls: str, queryContents: str,question: str,write_excel:\
          \ int) -> dict:\n    sqls = sqls.replace('\"', '\\\\\"')\n    \n    sqls\
          \ = sqls.replace('；', ';')\n    queryContents = queryContents.replace('；',\
          \ ';')\n    # 去除末尾的分号\n    sqls = remove_trailing_semicolon(sqls)\n    queryContents\
          \ = remove_trailing_semicolon(queryContents)\n    \n    \n    # 按分号分割成列表\n\
          \    sql_list = sqls.split(';')\n    query_content_list = queryContents.split(';')\
          \    \n    # 校验sql_list是否包含空的子串\n    if contains_empty_string(sql_list):\n\
          \        raise ValueError(\"sqls中包含空字符串\")\n    \n    # 校验query_content_list是否包含空的子串\n\
          \    if contains_empty_string(query_content_list):\n        raise ValueError(\"\
          queryContents中包含空字符串\")\n    \n    countMatchFlag = True\n    # 校验sql数量和queryContent数量是否相同\n\
          \    if len(sql_list) != len(query_content_list):\n        countMatchFlag\
          \ = False\n        #raise ValueError(f\"sql和queryContent的数量不相等，sql为{len(sql_list)}个，queryContent为{len(query_content_list)}个\"\
          )\n    \n    # 生成JSON对象\n    if countMatchFlag:\n        bits_sql = [{\"\
          sql\": sql, \"queryContent\": query} for sql, query in zip(sql_list, query_content_list)]\n\
          \    else:\n        bits_sql = [{\"sql\": sql} for sql in sql_list]\n  \
          \  result = {\"bits_sql\": bits_sql,\"sqls\":sqls,\"queryContents\":queryContents}\n\
          \    return result "
