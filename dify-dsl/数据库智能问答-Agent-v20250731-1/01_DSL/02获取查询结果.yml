    - data:
        code: "from typing import List, Dict, Any\nimport json\n\ndef main(echarts:\
          \ str, resultArray) -> dict:\n    # 解析 echarts 配置字符串为 JSON 数组\n    marker\
          \ = \"think>\"\n    marker_index = echarts.rfind(marker)\n    echarts =\
          \ echarts[marker_index + len(marker):] if marker_index != -1 else echarts\n\
          \    echarts_configs = json.loads(echarts)[\"analysis_result\"]\n    \n\
          \    onlyOne = False\n    tooMany = False\n    \n    # 初始化结果数组\n    echartsConfigs\
          \ = []\n    \n    # 遍历每个 echarts 配置和对应的查询结果\n    for echart_config, result\
          \ in zip(echarts_configs, resultArray):\n        chart_type = echart_config.get(\"\
          chartType\")\n        chartsFullTitle = ''\n        xAxisColumns = echart_config.get(\"\
          xAxisColumns\", [])\n        seriesColumns = echart_config.get(\"seriesColumns\"\
          , [])\n        nameColumns = echart_config.get(\"nameColumns\", [])\n  \
          \      chartsFullTitle = echart_config.get(\"chartsFullTitle\", '')\n  \
          \      # 初始化 xAxisData 和 seriesDatas\n        xAxisData = []\n        seriesDatas\
          \ = []\n        echarts_config = {}\n        if len(result['data']) > 1\
          \ and len(result['data']) < 13:\n            # 处理数据数组\n            for record\
          \ in result['data']:\n                # 构造 xAxis 数据\n                if\
          \ xAxisColumns:\n                    xAxis_value = \"_\".join([str(record.get(col))\
          \ for col in xAxisColumns])\n                    xAxisData.append(xAxis_value)\n\
          \                \n                # 构造 series 数据\n                series_data_list\
          \ = []\n                for col in seriesColumns:\n                    series_value\
          \ = record.get(col.get(\"columnName\"))\n                    # 判断是否是浮点数（小数）\n\
          \                    if isinstance(series_value, float):\n             \
          \           # 保留两位小数\n                        series_value = round(series_value,\
          \ 2)\n                    series_data_list.append(series_value)\n      \
          \          seriesDatas.append(series_data_list)\n            \n        \
          \    # 根据 chartType 生成对应的 echarts 配置\n            if chart_type == \"bar\"\
          \ or chart_type == \"line\":\n                # 处理柱状图或折线图\n            \
          \    seriesData_index = 0\n                for group_idx in range(0, len(seriesColumns),\
          \ 2):\n                    series_list = []\n                    yAxis_list\
          \ = []\n                    legendData = []\n                    formatterStr\
          \ = \"{b}\"\n                    # 获取当前分组的元素（最多两个）\n                   \
          \ group = seriesColumns[group_idx:group_idx+2]\n                    for\
          \ i, series_col in enumerate(group):\n                        series_item\
          \ = {\"data\": [row[seriesData_index] for row in seriesDatas],\"type\":\
          \ chart_type,\"name\": series_col.get(\"columnName\"),\"yAxisIndex\":i}\n\
          \                        series_list.append(series_item)\n             \
          \           yAxis_item = {\"type\": \"value\",\"name\":series_col.get(\"\
          columnName\")}\n                        yAxis_list.append(yAxis_item)\n\
          \                        legendData.append(series_col.get(\"columnName\"\
          ))\n                        formatterStr = formatterStr + \"<br/>{a\"+str(i)+\"\
          }：{c\"+str(i)+\"}\" \n                        seriesData_index = seriesData_index\
          \ + 1\n                    if chartsFullTitle == '':\n                 \
          \       chartsFullTitle = seriesColumns[0].get(\"chartsTitle\")\n      \
          \              echarts_config = {\"title\":{\"text\":chartsFullTitle},\"\
          legend\":{'orient':'horizontal','x':'left','y':'bottom','data':legendData},\"\
          toolbox\":{'show':True,'feature':{'magicType':{'type':['line','bar']},'saveAsImage':{'show':True}}},\"\
          tooltip\":{\"trigger\":'axis','triggerOn':'mousemove','formatter':formatterStr},\"\
          xAxis\": {\"type\": \"category\",\"axisLabel\":{\"interval\":0,\"rotate\"\
          :45},\"data\": xAxisData},\"yAxis\": yAxis_list,\"series\": series_list}\n\
          \                    # 将生成的配置添加到结果数组中\n                    echartsConfigs.append(echarts_config)\n\
          \            elif chart_type == \"pie\":\n                for series_col\
          \ in seriesColumns:\n                    chartsTitle = series_col.get(\"\
          chartsTitle\", '')\n                    if chartsTitle == '':\n        \
          \                chartsTitle = chartsFullTitle\n                    # 处理饼图\n\
          \                    pie_data = []\n                    legendData = []\n\
          \                    for record in result['data']:\n                   \
          \     name = \"_\".join([str(record.get(col)) for col in nameColumns])\n\
          \                        value = record.get(series_col.get(\"columnName\"\
          ))  \n                        # 判断是否是浮点数（小数）\n                        if\
          \ isinstance(series_value, float):\n                            # 保留两位小数\n\
          \                            value = round(value, 2)\n                 \
          \       pie_data.append({\"name\": name, \"value\": value})\n          \
          \              legendData.append(name)  \n                    orient = \"\
          vertical\"\n                    if len(legendData) > 3:\n              \
          \          orient = \"horizontal\"\n                    echarts_config =\
          \ {\"title\":{\"text\":chartsTitle},\"legend\":{'orient':orient,'x':'left','y':'bottom','data':legendData},\"\
          toolbox\":{'show':True,'feature':{'saveAsImage':{'show':True}}},'tooltip':{'trigger':'item'},\"\
          series\":[{\"type\":\"pie\",\"data\":pie_data}]}\n                    #\
          \ 将生成的配置添加到结果数组中\n                    echartsConfigs.append(echarts_config)\n\
          \        elif len(result['data']) == 1:\n            onlyOne = True\n  \
          \      elif len(result['data']) > 1:\n            tooMany = True\n     \
          \   \n    # 创建一个空列表来存储格式化后的字符串\n    formatted_strings = []\n    # 遍历 echartsConfigs\
          \ 列表\n    for echarts_config in echartsConfigs:\n        # 将 echarts_config\
          \ 转换为 JSON 格式的字符串，并添加前缀和后缀\n        formatted_string = \"```echarts\\n\"\
          \ + json.dumps(echarts_config, indent=2, ensure_ascii=False) + \"\\n```\\\
          n\"\n        # 将格式化后的字符串添加到列表中\n        formatted_strings.append(formatted_string)\n\
          \    # 使用 join() 方法将列表中的所有字符串拼接成一个单一的字符串\n    output_string = \"\".join(formatted_strings)\n\
          \    if len(resultArray) == 1 and tooMany:\n        output_string = \"数据条目较多，不适合使用图表展示\"\
          \ \n    print(output_string)\n    return {\"output_echarts\": output_string}"
